# Controlled dense mismatch template
# Selected: Qwen3-32B — ~64GB bf16, fits on 3x L40S GPUs (g6e.12xlarge)
# Available on free tier: Groq, Cerebras, OpenRouter
model_id: Qwen/Qwen3-32B
reference_engine: transformers
rollout_engines:
  - name: vllm
    precision: bf16
    tensor_parallel: 3
  - name: vllm
    precision: fp16
    tensor_parallel: 3
prompts_file: prompts/dense_smoke.jsonl
sampling:
  temperature: 1.0
  top_p: 1.0
  max_tokens: 512
  seed: 1234
metrics:
  clamp: 20.0
  include_token_level: true
  include_sequence_level: true
