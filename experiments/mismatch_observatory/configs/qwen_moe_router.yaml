# MoE router mismatch template
# Selected: Qwen3-30B-A3B — 30.5B total / 3.3B active, 128 experts (8 active)
# ~61GB bf16, fits on 3x L40S GPUs (g6e.12xlarge)
# Available on free tier: OpenRouter, Cerebras
# Use output_router_logits=True for expert trace extraction
model_id: Qwen/Qwen3-30B-A3B
reference_engine: transformers
rollout_engines:
  - name: vllm
    precision: bf16
    tensor_parallel: 3
router_trace:
  record_expert_ids: true
  compare_training_vs_rollout: true
prompts_file: prompts/moe_smoke.jsonl
sampling:
  temperature: 0.7
  top_p: 0.95
  max_tokens: 512
