# Endpoint identity gap probe template
providers:
  - name: fireworks
    base_url: https://api.fireworks.ai/inference/v1
    model: accounts/fireworks/models/llama-v3p1-8b-instruct
    require_logprobs: true
  - name: openrouter
    base_url: https://openrouter.ai/api/v1
    model: <model-id>
    require_logprobs: false
prompts_file: prompts/smoke_prompts.jsonl
sampling:
  temperature: 0.7
  top_p: 0.95
  max_tokens: 128
  seed: 1234
report_contract: experiments/mismatch_observatory/metrics_contract.json
